name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m venv "$RUNNER_TEMP/build-env"
          "$RUNNER_TEMP/build-env/bin/python" -m pip install 'setuptools>=77' wheel
          "$RUNNER_TEMP/build-env/bin/python" -m pip wheel --no-build-isolation --no-deps . -w "$RUNNER_TEMP/wheels"
          python -m venv "$RUNNER_TEMP/runtime-env"
          "$RUNNER_TEMP/runtime-env/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/wheels/*.whl
          echo "$RUNNER_TEMP/runtime-env/bin" >> "$GITHUB_PATH"
      - run: python -m unittest discover -s tests -v
      - run: |
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH python "$GITHUB_WORKSPACE/tools/wheel_smoke.py"
