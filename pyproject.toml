[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whatisit-macos"
version = "0.1.0"
description = "A small, macOS-first command lookup prototype"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
whatisit-macos = "whatisit_macos.cli:main"
whatisit-macos-build-docs = "whatisit_macos.build_docs:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whatisit_macos = ["recipes.json"]
