# Proposed only: do not train before issue #36's real verified v4 dataset gate.
# Requires independently verified train.jsonl/valid.jsonl, pinned model+tokenizer,
# and exact training/serving chat-template parity.
fine_tune_type: lora
optimizer: adamw
num_layers: 12
batch_size: 1
max_seq_length: 512
learning_rate: 1.0e-5
mask_prompt: true
grad_checkpoint: true
lora_parameters:
  keys:
    - self_attn.q_proj
    - self_attn.v_proj
  rank: 8
  scale: 20.0
  dropout: 0.0
